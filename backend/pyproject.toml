[project]
name = "kaleidogram-backend"
version = "0.1.0"
description = "App to generate allergene list for restaurant dish"
authors = [
    {name = "theKaido",email = "72819473+theKaido@users.noreply.github.com"}
]
license = "AGPL-3.0-or-later"
requires-python = ">=3.14"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.53.0,<0.54.0)",
    "sqlalchemy (>=2.0.52,<3.0.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "psycopg2-binary (>=2.9.13,<3.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "bcrypt (>=5.0.0,<6.0.0)",
    "pyjwt (>=2.14.0,<3.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
]

[tool.poetry]
package-mode = false

[tool.ruff.lint]
extend-select = ["D"]
ignore = ["D100", "D104", "D203", "D213"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff]
extend-exclude = ["alembic/"]
force-exclude = true


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "ruff (>=0.16.7,<0.17.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "httpx2 (>=2.13.0,<3.0.0)"
]
